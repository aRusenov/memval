[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memval"
version = "0.1.0"
description = "Hippocampal Sequence Learning Benchmarking Framework"
authors = [
    { name = "MemVal Contributors" }
]
readme = "memval_spec.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "jupyter>=1.0.0",
]
torch = ["torch>=2.0.0"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]
# Spiking CA3 arm (memval/vendor/ca3net). Brian2 is only imported when that arm
# is constructed -- see memval/vendor/ca3net/__init__.py, which keeps submodule
# imports lazy so the registry can be imported without it.
brian2 = ["brian2>=2.5"]

[tool.setuptools.packages.find]
include = ["memval*"]
